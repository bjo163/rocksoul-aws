name: Cosmic Dev Fast Gate

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmic-dev-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast contract and static gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency integrity
        run: npm run dependency:integrity

      - name: Documentation check
        run: npm run docs:check

      - name: Architecture check
        run: npm run architecture:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: SQL and persistence boundary
        run: npm run test:persistence-boundary

      - name: Auth/session contracts
        run: npm run test:auth-session

      - name: UI shared contracts
        run: npm run test:ui-shared

      - name: Production certification contracts
        run: npm run test:production-certification
