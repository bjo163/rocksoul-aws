name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm dependency audit
    runs-on: [self-hosted, linux, x64, cosmic]
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from canonical lockfile
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high --json > npm-audit.json; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "npm audit failed after 3 attempts; see npm-audit.json for the registry/audit response."
              cat npm-audit.json
              exit 1
            fi
            sleep 5
          done
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const meta = report.metadata?.vulnerabilities ?? {};
          console.log(`npm audit: ${meta.total ?? 0} total vulnerabilities; high=${meta.high ?? 0}; critical=${meta.critical ?? 0}`);
          if ((meta.high ?? 0) > 0 || (meta.critical ?? 0) > 0) process.exit(1);
          NODE
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: warn
