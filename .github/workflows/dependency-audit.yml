name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from canonical lockfile
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          audit_status=0
          for attempt in 1 2 3; do
            set +e
            npm audit --omit=dev --json > npm-audit.json
            audit_status=$?
            set -e
            if node -e "JSON.parse(require('fs').readFileSync('npm-audit.json','utf8')); process.exit(0)" 2>/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "npm audit did not return valid JSON after 3 attempts."
              cat npm-audit.json
              exit 1
            fi
            sleep 5
          done
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const meta = report.metadata?.vulnerabilities ?? {};
          console.log(`npm audit: ${meta.total ?? 0} total vulnerabilities; high=${meta.high ?? 0}; critical=${meta.critical ?? 0}`);
          if ((meta.high ?? 0) > 0 || (meta.critical ?? 0) > 0) process.exit(1);
          NODE
          # npm audit returns non-zero when findings meet its threshold; the JSON metadata above is authoritative for this gate.
          if [[ "$audit_status" -ne 0 ]]; then
            echo "npm audit reported findings, but no high/critical production vulnerability was found; continuing."
          fi
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: warn
