name: Documentation Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/docs-validation.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check required documentation
        shell: bash
        run: |
          set -euo pipefail
          required=(README.md docs/README.md docs/TODO.md docs/DEPENDENCY_MANAGEMENT.md docs/RELEASE_CHECKLIST.md)
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty documentation: $file"; exit 1; }
          done
      - name: Check broken relative Markdown targets
        shell: python
        run: |
          import pathlib, re, sys

          roots = [pathlib.Path('README.md'), *pathlib.Path('docs').rglob('*.md')]
          errors = []
          link_re = re.compile(r'(?<!!)(?<!\[)\[[^\]]+\]\(([^)]+)\)')

          for path in roots:
              lines = path.read_text(encoding='utf-8').splitlines()
              in_fence = False
              for line_number, line in enumerate(lines, 1):
                  if re.match(r'^\s*```', line):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  for match in link_re.finditer(line):
                      target = match.group(1).strip().split('#', 1)[0]
                      if not target or '://' in target or target.startswith(('#', '/', 'mailto:')):
                          continue
                      target = target.split('?', 1)[0]
                      candidate = (path.parent / target).resolve()
                      if not candidate.exists():
                          errors.append(f'{path}:{line_number}: {target}')

          report = pathlib.Path('docs-link-errors.txt')
          report.write_text('\n'.join(errors) + ('\n' if errors else ''), encoding='utf-8')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Documentation links passed.')
      - name: Upload documentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-validation-report
          path: docs-link-errors.txt
          if-no-files-found: warn
