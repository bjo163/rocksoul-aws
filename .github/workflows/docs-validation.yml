name: Documentation Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/docs-validation.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check required documentation
        shell: bash
        run: |
          set -euo pipefail
          required=(README.md docs/README.md docs/TODO.md docs/DEPENDENCY_MANAGEMENT.md docs/RELEASE_CHECKLIST.md)
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty documentation: $file"; exit 1; }
          done
      - name: Check broken relative Markdown targets
        shell: python
        run: |
          import pathlib, re, sys
          errors=[]
          for path in [pathlib.Path('README.md'), *pathlib.Path('docs').rglob('*.md')]:
              text=path.read_text(encoding='utf-8')
              for target in re.findall(r'\[[^]]+\]\(([^)]+)\)', text):
                  if '://' in target or target.startswith('#') or target.startswith('mailto:'): continue
                  target=target.split('#',1)[0]
                  candidate=(path.parent/target).resolve()
                  if not candidate.exists(): errors.append(f'{path}: {target}')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('Documentation links passed.')
