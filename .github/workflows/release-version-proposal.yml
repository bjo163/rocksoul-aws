name: Release Version Audit

on:
  workflow_run:
    workflows: [AWS CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-version-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, x64, cosmic]
    steps:
      - name: Checkout certified main candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Ensure candidate is current main
        if: github.event_name == 'workflow_run'
        run: |
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Audit conventional-commit version plan
        run: node scripts/release-version.mjs plan

      - name: Enforce two-branch release model
        run: |
          set -euo pipefail
          unexpected="$(
            git ls-remote --heads origin               | awk '{sub("refs/heads/", "", $2); print $2}'               | grep -Ev '^(main|dev)$' || true
          )"
          if [ -n "$unexpected" ]; then
            echo "Noncanonical remote branches detected:"
            echo "$unexpected"
            exit 1
          fi
          echo "Release version changes must be prepared on dev and promoted via dev -> main."
