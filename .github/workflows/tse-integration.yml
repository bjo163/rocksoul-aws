name: TSE Integration Spike

on:
  pull_request:
    branches: [dev]
    paths:
      - 'packages/tse-engine/**'
      - 'tests/tse-cosmic-integration.test.ts'
      - '.github/workflows/tse-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tse:
    name: TSE → Mizan/AI contract
    runs-on: [self-hosted, linux, x64, cosmic]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Run TSE integration tests
        run: node scripts/transpile-runner.mjs tests/tse-cosmic-integration.test.ts
