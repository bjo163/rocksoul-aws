name: CodeQL

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  contents: read

jobs:
  analyze:
    name: CodeQL analysis
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  private-repository-advisory:
    name: CodeQL advisory (private repository)
    if: ${{ github.event.repository.visibility != 'public' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report availability constraint
        run: |
          echo "CodeQL scan skipped: this repository is private and GitHub Code Security is not available for the current repository plan/configuration."
          echo "Enable GitHub Code Security/Advanced Security or make the repository public to activate CodeQL scanning." 
