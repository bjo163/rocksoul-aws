name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:

permissions:
  packages: read
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL analysis
    if: ${{ github.event.repository.visibility == 'public' }}
    permissions:
      security-events: write
      packages: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  private-repository-advisory:
    name: CodeQL advisory (private repository)
    if: ${{ github.event.repository.visibility != 'public' }}
    runs-on: [self-hosted, linux, x64, cosmic]
    steps:
      - name: Report availability constraint
        run: |
          echo "CodeQL scan skipped: this repository is private and GitHub Code Security is not available for the current repository plan/configuration."
          echo "Enable GitHub Code Security/Advanced Security or make the repository public to activate CodeQL scanning."
