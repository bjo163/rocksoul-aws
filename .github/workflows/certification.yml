name: Cosmic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, test, certify, and containerize
    runs-on: [self-hosted, linux, x64, cosmic]
    timeout-minutes: 60

    env:
      STORAGE_DRIVER: postgres
      PGHOST: 127.0.0.1
      PGPORT: 55432
      PGUSER: postgres
      PGPASSWORD: postgres-ci-only
      PGDATABASE: moonwitness_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start PostgreSQL 18
        run: |
          set -euo pipefail
          docker rm -f cosmic-postgres-ci >/dev/null 2>&1 || true
          docker run -d --name cosmic-postgres-ci \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres-ci-only \
            -e POSTGRES_DB=moonwitness_ci \
            --health-cmd="pg_isready -U postgres -d moonwitness_ci" \
            --health-interval=2s \
            --health-timeout=5s \
            --health-retries=30 \
            postgres:18
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' cosmic-postgres-ci 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "unhealthy" ]; then
              docker logs cosmic-postgres-ci || true
              exit 1
            fi
            sleep 2
          done
          status=$(docker inspect --format='{{.State.Health.Status}}' cosmic-postgres-ci)
          test "$status" = healthy
          postgres_ip=$(docker inspect --format='{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' cosmic-postgres-ci)
          test -n "$postgres_ip"
          echo "PGHOST=$postgres_ip" >> "$GITHUB_ENV"
          echo "PGPORT=5432" >> "$GITHUB_ENV"
          echo "PostgreSQL container IP: $postgres_ip"
          node - "$postgres_ip" <<'NODE'
          const net = require('node:net');
          const host = process.argv[2];
          const socket = net.createConnection({ host, port: 5432 });
          socket.setTimeout(5000);
          socket.on('connect', () => { console.log(`PostgreSQL TCP reachable at ${host}:5432`); socket.end(); });
          socket.on('error', (error) => { console.error(error); process.exit(1); });
          socket.on('timeout', () => { console.error('PostgreSQL TCP connection timed out'); socket.destroy(); process.exit(1); });
          NODE

      - name: Synchronize lockfile with manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Dependency integrity
        run: npm run dependency:integrity

      - name: Dependency audit
        run: npm run dependency:audit

      - name: Documentation check
        run: npm run docs:check

      - name: Architecture check
        run: npm run architecture:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Release identity
        run: npm run release:identity

      - name: Release-focused tests
        run: npm run test:release

      - name: PostgreSQL certification
        run: npm run test:postgres

      - name: Build API
        run: npm run build:api

      - name: Build CAB
        run: npm run build:cab

      - name: Build Web
        run: npm run build:web

      - name: Build XRP
        run: npm run build:xrp

      - name: Build Flow
        run: npm run build:flow

      - name: Final certification
        run: npm run certify:current

      - name: Build Docker image
        run: docker build -t cosmic:${{ github.sha }} .

      - name: Cleanup PostgreSQL
        if: always()
        run: docker rm -f cosmic-postgres-ci >/dev/null 2>&1 || true
