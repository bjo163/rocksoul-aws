name: MoonWitness Certification

# Sole PR merge gate: dependency/security checks + quality + release certification + production container build.
# Use a known modern Linux ABI so native modules such as better-sqlite3 match the test runtime.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Build, test, certify, and containerize
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source with complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve authoritative coding base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            BASE_SHA="$(git merge-base HEAD refs/remotes/origin/main)"
          fi
          test -n "$BASE_SHA"
          git fetch --no-tags origin "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          echo "PR_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "Resolved coding base: $BASE_SHA"
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install workspace dependencies from canonical lockfile
        run: npm ci --ignore-scripts
      - name: Dependency integrity gate
        run: npm run dependency:integrity
      - name: Production dependency audit
        run: npm run dependency:audit
      - name: Documentation validation
        run: npm run docs:check
      - name: Coding standard gate
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Verify release identity
        run: npm run release:identity
      - name: Build API
        run: npm run build:api
      - name: Build CAB
        run: npm run build:cab
      - name: Build public web
        run: npm run build:web
      - name: Build XRP
        run: npm run build:xrp
      - name: Build Flow
        run: npm run build:flow
      - name: Run release test suite
        run: npm run test:release
      - name: Run release certification
        run: npm run certify:current
      - name: Build production Docker image
        run: docker build --file Dockerfile --tag cosmic:ci .
      - name: Inspect production image metadata
        run: docker image inspect cosmic:ci --format '{{.Config.Cmd}}'
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: warn
      - name: Upload documentation validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-validation-report
          path: docs-link-errors.txt
          if-no-files-found: warn
