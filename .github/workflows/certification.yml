name: Cosmic CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, test, certify, and containerize
    runs-on: [self-hosted, linux, x64, cosmic]
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only
          POSTGRES_DB: moonwitness_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      STORAGE_DRIVER: postgres
      PGHOST: 127.0.0.1
      PGPORT: 55432
      PGUSER: postgres
      PGPASSWORD: postgres-ci-only
      PGDATABASE: moonwitness_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency integrity
        run: npm run dependency:integrity

      - name: Dependency audit
        run: npm run dependency:audit

      - name: Documentation check
        run: npm run docs:check

      - name: Architecture check
        run: npm run architecture:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Release identity
        run: npm run release:identity

      - name: Release-focused tests
        run: npm run test:release

      - name: PostgreSQL certification
        run: npm run test:postgres

      - name: Build API
        run: npm run build:api

      - name: Build CAB
        run: npm run build:cab

      - name: Build Web
        run: npm run build:web

      - name: Build XRP
        run: npm run build:xrp

      - name: Build Flow
        run: npm run build:flow

      - name: Final certification
        run: npm run certify:current

      - name: Build Docker image
        run: docker build -t cosmic:${{ github.sha }} .
