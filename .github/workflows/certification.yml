name: MoonWitness Certification

# Sole PR merge gate: dependency/security checks + quality + release certification + production container build.
# The runner remains self-hosted (no GitHub-hosted billing); the job runs inside a modern
# Node/Debian container so native modules such as better-sqlite3 use a compatible glibc.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Build, test, certify, and containerize
    runs-on: [self-hosted, linux, x64, cosmic]
    container:
      image: node:22-bookworm
      options: >-
        --volume /var/run/docker.sock:/var/run/docker.sock
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only
          POSTGRES_DB: moonwitness_ci
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STORAGE_DRIVER: postgres
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres-ci-only
      PGDATABASE: moonwitness_ci
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - name: Check out source with complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify container runtime
        run: |
          set -euo pipefail
          node --version
          git --version
      - name: Install Docker CLI for production image build
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends docker.io
          docker version
      - name: Resolve authoritative coding base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            BASE_SHA="$(git merge-base HEAD refs/remotes/origin/main)"
          fi
          test -n "$BASE_SHA"
          git fetch --no-tags origin "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          echo "PR_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "Resolved coding base: $BASE_SHA"
      - name: Install workspace dependencies from canonical lockfile
        run: npm ci --ignore-scripts
      - name: Dependency integrity gate
        run: npm run dependency:integrity
      - name: Production dependency audit
        run: npm run dependency:audit
      - name: Documentation validation
        run: npm run docs:check
      - name: Coding standard gate
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Verify release identity
        run: npm run release:identity
      - name: Build API
        run: npm run build:api
      - name: Build CAB
        run: npm run build:cab
      - name: Build public web
        run: npm run build:web
      - name: Build XRP
        run: npm run build:xrp
      - name: Build Flow
        run: npm run build:flow
      - name: Run PostgreSQL integration certification
        run: npm run test:postgres
      - name: Run release test suite
        run: npm run test:release
      - name: Run release certification
        run: npm run certify:current
      - name: Build production Docker image
        run: docker build --file Dockerfile --tag cosmic:ci .
      - name: Inspect production image metadata
        run: docker image inspect cosmic:ci --format '{{.Config.Cmd}}'
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: warn
      - name: Upload documentation validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-validation-report
          path: docs-link-errors.txt
          if-no-files-found: warn
