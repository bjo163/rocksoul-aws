name: AWS CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, test, certify, and containerize
    runs-on: [self-hosted, linux, x64, cosmic]
    timeout-minutes: 60

    env:
      STORAGE_DRIVER: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres-ci-only
      PGDATABASE: moonwitness_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Start PostgreSQL 18
        run: |
          set -euo pipefail
          docker rm -f cosmic-postgres-ci >/dev/null 2>&1 || true
          docker run -d --name cosmic-postgres-ci \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres-ci-only \
            -e POSTGRES_DB=moonwitness_ci \
            --health-cmd="pg_isready -U postgres -d moonwitness_ci" \
            --health-interval=2s \
            --health-timeout=5s \
            --health-retries=30 \
            postgres:18
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' cosmic-postgres-ci 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              echo "PostgreSQL is ready inside cosmic-postgres-ci"
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs cosmic-postgres-ci || true
              exit 1
            fi
            sleep 2
          done
          status=$(docker inspect --format='{{.State.Health.Status}}' cosmic-postgres-ci)
          test "$status" = healthy
          docker exec cosmic-postgres-ci pg_isready -U postgres -d moonwitness_ci

      - name: Synchronize lockfile with manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Dependency integrity
        run: npm run dependency:integrity

      - name: Dependency audit
        run: npm run dependency:audit

      - name: Documentation check
        run: npm run docs:check

      - name: Architecture check
        run: npm run architecture:check

      - name: Engine-only release scope
        run: node scripts/release-scope-check.mjs

      - name: Package build and runtime contracts
        run: npm run test:package-runtime

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Release versioning policy
        run: npm run test:release-versioning

      - name: Release identity
        run: npm run release:identity

      - name: Generate verified release provenance
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/cosmic-release-evidence
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_EVIDENCE_DIR"
          npm run release:provenance -- --output "$RELEASE_EVIDENCE_DIR/release-provenance.json"
          npm run release:provenance -- --verify "$RELEASE_EVIDENCE_DIR/release-provenance.json"

      - name: Release-focused tests
        run: npm run test:release

      - name: PostgreSQL certification
        run: |
          set -euo pipefail
          docker rm -f cosmic-postgres-test >/dev/null 2>&1 || true
          docker create \
            --name cosmic-postgres-test \
            --network container:cosmic-postgres-ci \
            -w /workspace \
            -e STORAGE_DRIVER=postgres \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGUSER=postgres \
            -e PGPASSWORD=postgres-ci-only \
            -e PGDATABASE=moonwitness_ci \
            node:26-bookworm \
            bash -lc 'npm run test:postgres'
          docker cp "$GITHUB_WORKSPACE/." cosmic-postgres-test:/workspace
          docker start -a cosmic-postgres-test

      - name: Build API
        run: npm run build:api

      - name: Final certification
        run: npm run certify:current

      - name: Build Docker image
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/cosmic-release-evidence
        run: |
          set -euo pipefail
          docker pull ghcr.io/${{ github.repository }}:latest || true
          docker build --cache-from ghcr.io/${{ github.repository }}:latest -t cosmic:${{ github.sha }} .
          image_id=$(docker image inspect --format='{{.Id}}' "cosmic:${{ github.sha }}")
          created=$(docker image inspect --format='{{.Created}}' "cosmic:${{ github.sha }}")
          cat > "$RELEASE_EVIDENCE_DIR/container-image.json" <<EOF
          {
            "protocol": "COSMIC_CONTAINER_IMAGE_V1",
            "source": {
              "repository": "${{ github.repository }}",
              "gitSha": "${{ github.sha }}",
              "runId": "${{ github.run_id }}",
              "runAttempt": "${{ github.run_attempt }}"
            },
            "image": {
              "tag": "cosmic:${{ github.sha }}",
              "imageId": "$image_id",
              "created": "$created"
            }
          }
          EOF

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/cosmic-release-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup PostgreSQL
        if: always()
        run: |
          docker rm -f cosmic-postgres-test >/dev/null 2>&1 || true
          docker rm -f cosmic-postgres-ci >/dev/null 2>&1 || true
